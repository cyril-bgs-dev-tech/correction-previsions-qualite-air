<text x="605" y="271" font-size="15.5" font-weight="600" fill="#1f2328">38,7&#8239;% <tspan fill="#57606a">(+2,3)</tspan></text>
<rect x="212" y="294" width="383.1" height="30" rx="2" fill="#d0d7de"/>
<rect x="595.1" y="294" width="2.0" height="30" rx="2" fill="#0969da"/>
<text x="202" y="315" font-size="15.5" text-anchor="end" fill="#1f2328">+ tendance récente</text>
<text x="607" y="315" font-size="15.5" font-weight="600" fill="#1f2328">38,9&#8239;% <tspan fill="#57606a">(+0,2)</tspan></text>
<rect x="212" y="338" width="385.1" height="30" rx="2" fill="#d0d7de"/>
<rect x="597.1" y="338" width="12.9" height="30" rx="2" fill="#0969da"/>
