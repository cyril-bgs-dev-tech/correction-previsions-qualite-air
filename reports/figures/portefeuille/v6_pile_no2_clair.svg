<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" preserveAspectRatio="xMinYMin meet" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Sur le NO₂, la pile passe de 26,6 % pour la base à 40,2 % avec la spéciation ; la typologie de station apporte le plus gros saut, +9,0 points, GEOS-CF +2,3 et la spéciation +1,3.</title>

<text x="0" y="22" font-size="20" font-weight="600" fill="#1f2328">NO₂ — ce que chaque étage ajoute</text>
<text x="0" y="43" font-size="15.5" fill="#57606a">Double aveugle, J+1 · ordre déclaré avant la mesure · membres et feux ont depuis été retirés de la pile</text>
<rect x="212" y="74" width="0.0" height="30" rx="2" fill="#d0d7de"/>
<rect x="212.0" y="74" width="263.4" height="30" rx="2" fill="#0969da"/>
<text x="202" y="95" font-size="15.5" text-anchor="end" fill="#1f2328">base</text>
<text x="485" y="95" font-size="15.5" font-weight="600" fill="#1f2328">26,6&#8239;%</text>
<rect x="212" y="118" width="263.4" height="30" rx="2" fill="#d0d7de"/>
<rect x="475.4" y="118" width="89.1" height="30" rx="2" fill="#0969da"/>
<text x="202" y="139" font-size="15.5" text-anchor="end" fill="#1f2328">+ typologie de station</text>
<text x="574" y="139" font-size="15.5" font-weight="600" fill="#1f2328">35,6&#8239;% <tspan fill="#57606a">(+9,0)</tspan></text>
<rect x="212" y="162" width="352.5" height="30" rx="2" fill="#d0d7de"/>
<rect x="564.5" y="162" width="5.0" height="30" rx="2" fill="#0969da"/>
<text x="202" y="183" font-size="15.5" text-anchor="end" fill="#1f2328">+ membres</text>
<text x="579" y="183" font-size="15.5" font-weight="600" fill="#1f2328">36,1&#8239;% <tspan fill="#57606a">(+0,5)</tspan></text>
<rect x="212" y="206" width="357.4" height="30" rx="2" fill="#d0d7de"/>
<rect x="569.4" y="206" width="3.0" height="30" rx="2" fill="#0969da"/>
<text x="202" y="227" font-size="15.5" text-anchor="end" fill="#1f2328">+ feux</text>
<text x="582" y="227" font-size="15.5" font-weight="600" fill="#1f2328">36,4&#8239;% <tspan fill="#57606a">(+0,3)</tspan></text>
<rect x="212" y="250" width="360.4" height="30" rx="2" fill="#d0d7de"/>
<rect x="572.4" y="250" width="22.8" height="30" rx="2" fill="#0969da"/>
