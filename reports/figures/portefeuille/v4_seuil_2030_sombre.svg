<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Le nombre de stations en dépassement passe de 6 aujourd'hui à 109 en 2030, soit un facteur 18,2, sans qu'aucune émission n'ait changé.</title>

<text x="0" y="22" font-size="16" font-weight="600" fill="#e6edf3">Stations en dépassement — à pollution inchangée</text>
<text x="0" y="43" font-size="12.5" fill="#9198a1">Moyennes annuelles 2025 · 408 stations évaluées · seul le seuil réglementaire change</text>
<rect x="98" y="163" width="104" height="5" rx="3" fill="#9198a1"/>
<text x="150" y="151" font-size="19" font-weight="700" text-anchor="middle" fill="#e6edf3">6</text>
<text x="150" y="188" font-size="12.5" text-anchor="middle" fill="#9198a1">aujourd'hui</text>
<rect x="398" y="72" width="104" height="96" rx="3" fill="#4493f8"/>
<text x="450" y="60" font-size="19" font-weight="700" text-anchor="middle" fill="#e6edf3">109</text>
<text x="450" y="188" font-size="12.5" text-anchor="middle" fill="#9198a1">en 2030</text>
<path d="M 214 108 L 388 108" stroke="#e6edf3" stroke-width="2" marker-end="url(#p)"/>
<defs><marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e6edf3"/></marker></defs>
<text x="301" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">×18,2</text>
</svg>