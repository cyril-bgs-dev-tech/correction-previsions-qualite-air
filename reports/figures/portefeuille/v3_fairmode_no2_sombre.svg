<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 186" preserveAspectRatio="xMinYMin meet" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Pour le NO₂, 41,4 % des stations satisfont le critère avec CAMS brut, 87,9 % après correction sans observation locale et 96,2 % avec l'historique de station ; le seuil est à 90 %.</title>

<text x="0" y="22" font-size="20" font-weight="600" fill="#e6edf3">NO₂ — part des stations qui satisfont le critère européen de qualité</text>
<text x="0" y="43" font-size="15.5" fill="#9198a1">Critère FAIRMODE à J+1 · atteint à partir de 90 %</text>
<line x1="96" y1="104" x2="624" y2="104" stroke="#30363d" stroke-width="2"/>
<line x1="571.2" y1="64" x2="571.2" y2="126" stroke="#9198a1" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="314.6" cy="104" r="8" fill="none" stroke="#f85149" stroke-width="2.6"/>
<text x="314.6" y="84" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">41,4&#8239;%</text>
<text x="314.6" y="67" font-size="14" text-anchor="middle" fill="#9198a1">CAMS brut</text>
<path d="M 560.1 95 L 569.1 104 L 560.1 113 L 551.1 104 Z" fill="#e6edf3"/>
<text x="560.1" y="138" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">87,9&#8239;%</text>
<text x="560.1" y="155" font-size="14" text-anchor="middle" fill="#9198a1">corrigé, sans observation</text>
<circle cx="603.9" cy="104" r="8.5" fill="#3fb950"/>
<text x="603.9" y="84" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">96,2&#8239;%</text>
<text x="603.9" y="67" font-size="14" text-anchor="middle" fill="#9198a1">corrigé, aux stations</text>
</svg>