<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" preserveAspectRatio="xMinYMin meet" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Le routage perd 0,01 sur l'ensemble du multivarié, gagne 0,03 à partir de huit variables et 0,07 au-delà de vingt.</title>

<text x="0" y="22" font-size="20" font-weight="600" fill="#1f2328">Le routage ne devient utile qu'en dimension suffisante</text>
<text x="0" y="43" font-size="15.5" fill="#57606a">Gain VUS-PR du routage sur le meilleur modèle seul · protocole LODO</text>
<line x1="296.8" y1="56" x2="296.8" y2="220" stroke="#57606a" stroke-width="1.4"/>
<rect x="246.0" y="74" width="50.8" height="32" rx="2" fill="#cf222e"/>
<text x="236" y="96" font-size="15.5" text-anchor="end" fill="#1f2328">tout le multivarié (d ≥ 2)</text>
<text x="305.8" y="96" font-size="15.5" font-weight="600" text-anchor="start" fill="#1f2328">−0,01</text>
<rect x="296.8" y="122" width="152.2" height="32" rx="2" fill="#0969da"/>
<text x="236" y="144" font-size="15.5" text-anchor="end" fill="#1f2328">multivarié réel (d ≥ 8)</text>
<text x="458.0" y="144" font-size="15.5" font-weight="600" text-anchor="start" fill="#1f2328">+0,03</text>
<rect x="296.8" y="170" width="355.2" height="32" rx="2" fill="#0969da"/>
<text x="236" y="192" font-size="15.5" text-anchor="end" fill="#1f2328">haute dimension (d ≥ 20)</text>
<text x="661.0" y="192" font-size="15.5" font-weight="600" text-anchor="start" fill="#1f2328">+0,07</text>
<text x="296.8" y="238" font-size="14" text-anchor="middle" fill="#57606a">0 — le meilleur modèle seul</text>
</svg>