- code: "85"
  nom: "Vendee"
  region: "Pays de la Loire"
  resume: >
    Quatre journees d'indice mauvais en 2024 contre quatorze en 2023, et aucune
    procedure d'information : une annee sans evenement a detecter.
  sources_dominantes:
    - libelle: "Quatre sources retenues a parts non hierarchisees par Air Pays de la Loire : trafic routier, chauffage au bois individuel, agriculture et industrie"
      polluants: ["NO2", "PM10", "PM2.5", "NH3"]
      confiance: "haute"
      source: "Air Pays de la Loire, Rapport annuel 2024, 2025, p. 55 - https://airpl.org/sites/default/files/reports/APL_RapportAnnuel-2024_BD.pdf"
    - libelle: "Deux environnements suivis seulement : le fond urbain de La Roche-sur-Yon (Delacroix) et le site rural de La Tardiere"
      polluants: ["NO2", "PM10", "O3"]
      confiance: "haute"
      source: "Air Pays de la Loire, Rapport annuel 2024, 2025, p. 54 et p. 55 - https://airpl.org/sites/default/files/reports/APL_RapportAnnuel-2024_BD.pdf"
  topographie_climat: null
  regime_episodes: null
  transport_longue_distance: null
  cadre_decision:
    ppa: "Aucun PPA en Vendee ; le PPA des Pays de la Loire couvre Nantes - Saint-Nazaire"
    zfe: "Aucune ZFE-m documentee en Vendee"
    contentieux_no2: false
    confiance: "moyenne"
    source: "DREAL Pays de la Loire, Le PPA 2015 de Nantes - Saint-Nazaire, consulte en 2026 - https://www.pays-de-la-loire.developpement-durable.gouv.fr/le-ppa-2015-de-nantes-st-nazaire-a6686.html ; Air Pays de la Loire, Rapport annuel 2024, 2025, p. 55 - https://airpl.org/sites/default/files/reports/APL_RapportAnnuel-2024_BD.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        En 2024 aucune procedure d'information n'a ete mise en oeuvre et aucun
        depassement du seuil d'information n'a ete mesure : sur cette annee-la, tout
        score de detection calcule sur la Vendee est indefini faute d'evenement positif.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Le nombre de journees d'indice mauvais passe de 14 a 4 d'une annee sur l'autre,
        pour des emissions comparables : comparer deux annees revient a comparer deux
        meteorologies, pas deux qualites de prevision.
      confiance: "haute"
      speculatif: false
  sans_source: null

- code: "86"
  nom: "Vienne"
  region: "Nouvelle-Aquitaine"
  resume: >
