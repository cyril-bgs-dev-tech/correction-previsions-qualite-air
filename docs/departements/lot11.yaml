    - libelle: "Surveillance elargie aux pesticides et aux particules fines et ultrafines, en plus des pollens : les autres departements voisins ne suivent que les pollens"
      polluants: ["PM2.5", "COV"]
      confiance: "haute"
      source: "Atmo Nouvelle-Aquitaine, Bilan annuel 2024 de la qualite de l'air en Vienne, juin 2025, p. 3 et p. 8 - https://www.atmo-nouvelleaquitaine.org/sites/nouvelleaquitaine/files/medias/documents/2025-06/BAQA_DEPT_Vienne_D86_2025-06-02.pdf"
  topographie_climat: null
  regime_episodes: null
  transport_longue_distance: null
  cadre_decision:
    ppa: "Non documente dans le bilan departemental 2024 consulte"
    zfe: "Non documentee dans le bilan departemental 2024 consulte"
    contentieux_no2: false
    confiance: "basse"
    source: "Atmo Nouvelle-Aquitaine, Bilan annuel 2024 de la qualite de l'air en Vienne, juin 2025, p. 3 - https://www.atmo-nouvelleaquitaine.org/sites/nouvelleaquitaine/files/medias/documents/2025-06/BAQA_DEPT_Vienne_D86_2025-06-02.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
