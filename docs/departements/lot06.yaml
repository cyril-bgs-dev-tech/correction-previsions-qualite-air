    vents_nommes: null
    confiance: "haute"
    source: "Prefecture de la Creuse, DDRM 23, edition 2021, p. 70; DREAL Nouvelle-Aquitaine, Vallee de la Creuse, page consultee le 10 aout 2026 - https://www.creuse.gouv.fr/index.php/contenu/telechargement/22260/164281/file/DDRM_23_2021-2.pdf ; https://www.nouvelle-aquitaine.developpement-durable.gouv.fr/creuse-a12449.html"
  regime_episodes:
    - saison: "hiver"
      polluant: "PM2.5"
      mecanisme: "Chauffage au bois et accumulation locale dans les cuvettes et vallees lors des situations peu dispersives"
      confiance: "moyenne"
      source: "Atmo Nouvelle-Aquitaine, Bilan annuel 2024 en Creuse, 13 octobre 2025, p. 7; Hiver: mieux comprendre les episodes de pollution, 4 fevrier 2026; Prefecture de la Creuse, DDRM 23, edition 2021, p. 70 - https://www.atmo-nouvelleaquitaine.org/sites/nouvelleaquitaine/files/medias/documents/2025-10/BAQA_DEPT_Creuse_D23_2025-10-13.pdf ; https://www.atmo-nouvelleaquitaine.org/actualite/hiver-mieux-comprendre-les-episodes-de-pollution-atmospherique ; https://www.creuse.gouv.fr/index.php/contenu/telechargement/22260/164281/file/DDRM_23_2021-2.pdf"
  transport_longue_distance: null
  cadre_decision:
    ppa: null
    zfe: null
    contentieux_no2: false
    confiance: "haute"
    source: "Ministere de la Transition ecologique, Agir pour reduire la pollution de l'air, mise a jour 29 juin 2026; Ministere de la Transition ecologique, Zones a faibles emissions, mise a jour 13 aout 2025; CJUE, arret C-636/18, 2019 - https://www.ecologie.gouv.fr/politiques-publiques/agir-reduire-pollution-lair ; https://www.ecologie.gouv.fr/politiques-publiques/zones-faibles-emissions-zfe ; https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
