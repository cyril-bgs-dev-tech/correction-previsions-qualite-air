      confiance: "haute"
      source: "Atmo Nouvelle-Aquitaine, Plan de surveillance 2025 de Saint-Gobain Eurocoustic a Genouillac, 25 mars 2026 - https://www.atmo-nouvelleaquitaine.org/publications/plan-de-surveillance-de-la-qualite-de-lair-2025-saint-gobain-eurocoustic-genouillac-23"
  topographie_climat:
    libelle: >
      Des plateaux atlantiques exposes alternent avec cuvettes et vallees encaissees; l'altitude et les premiers reliefs du Massif central creent plusieurs regimes climatiques locaux.
