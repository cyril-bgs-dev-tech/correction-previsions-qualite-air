    - libelle: "Industries et production d'energie concentrees dans l'ouest rhodanien"
      polluants: ["SO2", "COV", "PM10"]
      confiance: "haute"
      source: "AtmoSud, Vaucluse - sources de pollution et exposition, page consultee en 2026 — https://www.atmosud.org/article/vaucluse ; AtmoSud, Evaluation du PPA de Vaucluse, 10 decembre 2025 — https://www.atmosud.org/sites/sud/files/medias/documents/2026-02/251008_evaluation_pp84_atmosud.pdf"
  topographie_climat:
