      polluant: "PM10"
      regime: "flux_continentaux_de_nord_est_au_printemps"
      confiance: "haute"
      source: "Atmo Normandie, Chauffage au bois et qualite de l'air - Risachabois, 2021 — https://www.atmonormandie.fr/sites/normandie/files/medias/documents/2021-11/Rapport%20risachabois-vf24112021.pdf ; Atmo Normandie, Synthese CARA littoral, 2024 — https://www.atmonormandie.fr/sites/normandie/files/medias/documents/2024-02/Synth%C3%A8se%20CARA%20littoral_VF.pdf"
  cadre_decision:
    ppa: "PPA Vallee de la Seine 2023-2027 couvrant huit EPCI dont Rouen et Le Havre; suivi publie en juillet 2026"
    zfe: "ZFE de Rouen active pour Crit'Air 4, 5 et non classes; ZFE du Havre active pour vehicules non classes"
    contentieux_no2: false
    confiance: "haute"
    source: "DREAL Normandie, PPA Vallee de la Seine, approuve en 2023 — https://www.normandie.developpement-durable.gouv.fr/le-plan-de-protection-de-l-atmosphere-ppa-vallee-a5593.html ; DREAL Normandie, Avancement du PPA, juillet 2026 — https://www.normandie.developpement-durable.gouv.fr/le-plans-de-protection-de-l-atmosphere-ppa-vallee-a7032.html ; Metropole Rouen Normandie, Qui est concerne par la ZFE, page consultee en 2026 — https://zfe.metropole-rouen-normandie.fr/quel-vehicule-quand-et-ou/qui-est-concerne ; Ministere de la Transition ecologique, Zones a faibles emissions, mise a jour 2026 — https://www.ecologie.gouv.fr/politiques-publiques/zones-faibles-emissions-zfe ; CJUE, arret C-636/18, 2019 — https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Les panaches de cheminee sont etroits, eleves et tres dependants du vent; des emissions moyennees ratent les pointes mesurees sous leur trajectoire.
      confiance: "haute"
      speculatif: false
    - libelle: >
        L'inventaire territorial exclut le transport maritime international; sans inventaire portuaire separe, le modele sous-estime les zones du Havre et de Rouen.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Le contraste entre littoral, estuaire industriel, agglomeration rouennaise et plateaux agricoles est lisse par une correction departementale unique.
      confiance: "moyenne"
      speculatif: true
  sans_source: null
