  transport_longue_distance:
    - origine: "Marseille_Berre"
      polluant: "O3"
      regime: "flux_de_sud_et_brises_remontant_le_Rhone"
      confiance: "haute"
      source: "AtmoSud, Enjeu ozone et COV en region Sud, 2021 — https://www.atmosud.org/sites/sud/files/medias/documents/2024-05/210709_O3_COV_regionSud_emissions_enjeu.pdf ; AtmoSud, Vaucluse - sources de pollution et exposition, page consultee en 2026 — https://www.atmosud.org/article/vaucluse"
    - origine: "Sahara"
      polluant: "PM10"
      regime: "flux_de_sud"
      confiance: "haute"
      source: "AtmoSud, Procedures prefectorales - particules desertiques des 30 et 31 mars 2024, 2024 — https://daliaprod.atmosud.org/index.php?cont=sendProcedure&event=getPdf&file=pdf_349_MLTSRC_20240330_122231.pdf&saved=true"
  cadre_decision:
    ppa: "PPA de Vaucluse - Objectif 2030 approuve le 29 janvier 2026; tout le departement et bassin de vie d'Avignon"
    zfe: "ZFE d'Avignon annoncee mais non encore active selon la liste ministerielle consultee en 2026"
    contentieux_no2: false
    confiance: "haute"
    source: "DREAL PACA, PPA 84 approuve, 29 janvier 2026 — https://www.paca.developpement-durable.gouv.fr/apres-3-ans-de-revision-le-ppa84-est-approuve-a16432.html ; Ministere de la Transition ecologique, Zones a faibles emissions, mise a jour 2026 — https://www.ecologie.gouv.fr/politiques-publiques/zones-faibles-emissions-zfe ; CJUE, arret C-636/18, 2019 — https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Le mistral et les flux de sud produisent des regimes opposes; une climatologie moyenne attenue leur impact directionnel sur trafic, industrie et ozone.
      confiance: "moyenne"
      speculatif: true
    - libelle: >
        Une maille unique lisse le contraste entre ouest rhodanien urbanise et industriel, bassin d'Avignon et est agricole ou montagneux.
      confiance: "moyenne"
      speculatif: true
    - libelle: >
        L'ozone importe de Marseille-Berre peut etre corrige comme un biais local si les conditions aux limites ne representent pas son transport photochimique.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "76"
