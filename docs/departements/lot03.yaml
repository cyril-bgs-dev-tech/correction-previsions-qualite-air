      source: "AtmoSud, Evaluation du PPA de Vaucluse, 10 decembre 2025 — https://www.atmosud.org/sites/sud/files/medias/documents/2026-02/251008_evaluation_pp84_atmosud.pdf"
    - saison: "ete"
