      Le mistral ventile fortement le littoral occidental; autour de la rade, relief et alternance des brises marines deplacent les panaches entre ville, mer et collines.
    effet: "mixte"
    vents_nommes: ["mistral", "brise_de_mer"]
    confiance: "haute"
    source: "Meteo-France, Le mistral, 23 juillet 2026 — https://meteofrance.com/actualites-et-dossiers/comprendre-la-meteo/le-mistral-vent-regional ; AtmoSud, Suivi de la qualite de l'air autour de la rade de Toulon, 8 aout 2025 — https://www.atmosud.org/etude/suivi-de-la-qualite-de-lair-autour-de-la-rade-de-toulon"
  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Chauffage au bois et brulages sous conditions stables et peu ventees"
      confiance: "haute"
      source: "AtmoSud, Episode de pollution aux particules fines des 6 et 7 fevrier 2024, 2024 — https://www.atmosud.org/actualite/episode-de-pollution-aux-particules-fines-prevu-les-6-et-7-fevrier"
    - saison: "ete"
      polluant: "O3"
      mecanisme: "Photochimie plus marquee dans l'arriere-pays que sur le littoral"
      confiance: "haute"
      source: "AtmoSud, Var - sources de pollution et exposition, page consultee en 2026 — https://www.atmosud.org/article/var"
    - saison: "ete"
      polluant: "PM10"
      mecanisme: "Fumees episodiques de feux de foret et d'incendies de vegetation"
      confiance: "haute"
      source: "AtmoSud, Var - sources de pollution et exposition, page consultee en 2026 — https://www.atmosud.org/article/var"
  transport_longue_distance:
    - origine: "Sahara"
      polluant: "PM10"
      regime: "flux_de_sud"
      confiance: "haute"
      source: "AtmoSud, Procedures prefectorales - particules desertiques des 30 et 31 mars 2024, 2024 — https://daliaprod.atmosud.org/index.php?cont=sendProcedure&event=getPdf&file=pdf_349_MLTSRC_20240330_122231.pdf&saved=true"
    - origine: "Marseille_Berre"
      polluant: "O3"
      regime: "brises_et_circulations_regionales_vers_l_est"
      confiance: "haute"
      source: "AtmoSud, Enjeu ozone et COV en region Sud, 2021 — https://www.atmosud.org/sites/sud/files/medias/documents/2024-05/210709_O3_COV_regionSud_emissions_enjeu.pdf"
  cadre_decision:
    ppa: "PPA du Var - Objectif 2025 approuve; perimetre de 32 communes autour de Toulon et du SCoT Provence Mediterranee"
    zfe: "ZFE de Toulon annoncee mais non encore active selon la liste ministerielle consultee en 2026"
    contentieux_no2: true
    confiance: "haute"
    source: "DREAL PACA, Plans de protection de l'atmosphere approuves, mise a jour 2026 — https://www.paca.developpement-durable.gouv.fr/les-plans-de-protection-de-l-atmosphere-approuves-r3504.html ; DREAL PACA, PPA du Var - Objectif 2025, 2022 — https://www.paca.developpement-durable.gouv.fr/IMG/pdf/ppa_83_objectifs_2025.pdf ; Ministere de la Transition ecologique, Zones a faibles emissions, mise a jour 2026 — https://www.ecologie.gouv.fr/politiques-publiques/zones-faibles-emissions-zfe ; CJUE, arret C-636/18, 2019 — https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        La bascule quotidienne des brises de rade deplace les panaches maritimes; une moyenne journaliere masque leur direction et leurs pointes horaires.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Les feux de foret sont intermittents, mobiles et absents des inventaires ordinaires; ils peuvent dominer ponctuellement les particules.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Une maille departementale confondrait littoral dense, rade semi-fermee et arriere-pays boise, dont les regimes d'ozone et de particules divergent.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "84"
  nom: "Vaucluse"
  region: "Provence-Alpes-Cote d'Azur"
  resume: >
    Couloir rhodanien tres ventile mais charge en trafic, agriculture et habitat; l'ouest urbanise recoit aussi l'ozone photochimique de Marseille-Berre.
