  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Combustion residentielle et brulages lors des periodes froides et peu ventees"
      confiance: "haute"
      source: "AtmoSud, Vaucluse - sources de pollution et exposition, page consultee en 2026 — https://www.atmosud.org/article/vaucluse"
    - saison: "printemps"
      polluant: "PM10"
      mecanisme: "Emissions agricoles de NH3 et de poussieres, favorisant les particules secondaires"
