    - libelle: "Chauffage residentiel au bois et brulage de vegetaux dans l'arriere-pays"
      polluants: ["PM10", "PM2.5", "COV"]
      confiance: "haute"
      source: "AtmoSud, Var - sources de pollution et exposition, page consultee en 2026 — https://www.atmosud.org/article/var"
