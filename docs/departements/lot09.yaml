      confiance: "haute"
      source: "ATMO Grand Est, Bilan de l'episode PM10 du 23 au 27 janvier 2026, 30 janvier 2026 - https://www.atmo-grandest.eu/publications/bilan-episode-de-pollution-aux-particules-pm10-dans-le-grand-est-du-23-au-27-janvier"
    - saison: "ete"
