    - saison: "ete"
      polluant: "O3"
      mecanisme: "Ozone determinant frequemment l'indice regional au printemps et en ete"
      confiance: "haute"
      source: "Air Pays de la Loire, Rapport annuel 2025, 29 juin 2026 - https://www.airpl.org/rapport/rapport-annuel-2025"
  transport_longue_distance:
    - origine: "Sahara"
      polluant: "PM10"
      regime: "panache desertique et procedure d'information en Mayenne le 24 juin 2026"
      confiance: "haute"
      source: "Air Pays de la Loire, Depassement PM10 du 23 juin 2026, 24 juin 2026 - https://www.airpl.org/actualite/depassement-du-seuil-d-information-pour-les-particules-pm10-le-23-06-26-en-loire-atlantique-et-vendee"
  cadre_decision:
    ppa: "aucun PPA en Mayenne; le seul PPA regional couvre Nantes-Saint-Nazaire"
    zfe: "aucune ZFE repertoriee en Mayenne sur la carte ministerielle en vigueur"
    contentieux_no2: false
    confiance: "haute"
    source: "DREAL Pays de la Loire, Air et pollution atmospherique, consulte en 2026 - https://www.pays-de-la-loire.developpement-durable.gouv.fr/air-et-pollution-atmospherique-r212.html ; Ministere de la Transition ecologique, Zones a faibles emissions, consulte en 2026 - https://www.ecologie.gouv.fr/politiques-publiques/zones-faibles-emissions-zfe ; CJUE, affaire C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Le site rural de Saint-Denis-d'Anjou et les stations de Laval representent des regimes opposes; leur fusion masque les gradients industrie-ville-elevage.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Les vallees encaissees et la trame bocagere sont sous-mailles et peuvent modifier localement vent, melange et dispersion des panaches.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "54"
  nom: "Meurthe-et-Moselle"
  region: "Grand Est"
  resume: >
    Bassin nanceien abrite, trafic, bois, agriculture et industries du sud cumulent leurs signatures; stabilite hivernale, ozone et Sahara changent les episodes.
  sources_dominantes:
    - libelle: "Chauffage residentiel, premier secteur pour PM2.5 et PM10"
