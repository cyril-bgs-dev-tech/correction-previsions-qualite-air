    vents_nommes: null
    confiance: "haute"
    source: "Prefecture de Meurthe-et-Moselle, PPA revise de l'agglomeration de Nancy, mise a jour 4 septembre 2024, p. 8 - https://www.meurthe-et-moselle.gouv.fr/contenu/telechargement/32530/246729/file/Annexe__Plan_d%27action__%C3%A0_l%27AP_2024-0295.pdf"
