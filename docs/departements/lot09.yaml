      confiance: "haute"
      source: "ATMO Grand Est, Les chiffres-cles en un clin d'oeil - Meurthe-et-Moselle, edition 2025, Invent'Air v2025 du 18 septembre 2025, p. 2 - https://observatoire.atmo-grandest.eu/wp-content/uploads/publications/chiffres_cles_1_clin_oeil_2023_dep_Meurthe-et-Moselle.pdf"
    - libelle: "Cimenterie de Frolois et acierie de Neuves-Maisons, sources ponctuelles du sud nanceien"
      polluants: ["PM10", "SO2"]
      confiance: "haute"
      source: "ATMO Grand Est, Bilan qualite de l'air Grand Est 2022, 2023, p. 23 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2023-07/ATMO%20rapport%202022_web.pdf"
  topographie_climat:
