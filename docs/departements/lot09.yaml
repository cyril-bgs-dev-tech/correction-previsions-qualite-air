      source: "ATMO Grand Est, Bilan de l'episode PM10 du 14 novembre 2025, 18 novembre 2025 - https://www.atmo-grandest.eu/publications/bilan-episode-de-pollution-aux-particules-pm10-dans-le-grand-est-du-14-novembre-2025"
  cadre_decision:
    ppa: "PPA de Nancy adopte en 2015; revision et nouveau perimetre engages en 2025"
    zfe: "ZFE du Grand Nancy active depuis le 1er janvier 2025 pour les PL, VUL et bus/cars Crit'Air 5 ou non classes"
