      confiance: "haute"
      source: "Prefecture de Meurthe-et-Moselle, PPA de l'agglomeration de Nancy, mise a jour 4 septembre 2024 - https://www.meurthe-et-moselle.gouv.fr/Actions-de-l-Etat/Environnement/Air-climat-energie/Qualite-de-l-air/PPA-de-l-agglomeration-de-Nancy/PPA-de-l-agglomeration-de-Nancy"
