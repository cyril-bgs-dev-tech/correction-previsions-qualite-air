  cadre_decision:
    ppa: "Aucun PPA ; le secteur de l'aire urbaine Belfort-Montbeliard est l'une des quatre Zones A Risque de Bourgogne-Franche-Comte"
    zfe: "Aucune ZFE-m documentee dans le Territoire de Belfort"
    contentieux_no2: false
    confiance: "haute"
    source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 19 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Le seul episode manque de l'annee dans la region s'est produit ici, avec des
        sources primaires de combustion de biomasse : ce sont les episodes locaux et
        primaires, sans signature regionale, que la chaine ne voit pas venir.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Le departement est le plus petit de France et sa Zone A Risque deborde sur le
        Doubs : une maille departementale n'a pas de sens ici, l'objet pertinent est
        l'aire urbaine Belfort-Montbeliard.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "91"
  nom: "Essonne"
  region: "Ile-de-France"
  resume: >
    Tout a baisse en 2024 sauf l'ozone ; les depassements se relevent au droit des
    grands axes A6, A10, N20 et N104 et autour de Paris-Orly.
  sources_dominantes:
    - libelle: "Grands axes routiers A6, A10, N20 et N104 : les depassements de la valeur limite annuelle de NO2 y sont ponctuellement releves, au droit et au voisinage de la voirie"
      polluants: ["NO2"]
      confiance: "haute"
      source: "Airparif, Bilan de la qualite de l'air 2024 - Essonne, 2025, p. 3 - https://www.airparif.fr/sites/default/files/document_publication/Bilan_QA_91_2024.pdf"
    - libelle: "Plateforme aeroportuaire de Paris-Orly, qui fait l'objet d'une surveillance distincte de celle du departement"
      polluants: ["NO2", "PM2.5"]
      confiance: "haute"
      source: "Airparif, Bilan de la qualite de l'air 2024 - Essonne, 2025, p. 3 - https://www.airparif.fr/sites/default/files/document_publication/Bilan_QA_91_2024.pdf"
    - libelle: "Chauffage residentiel, dont le recours a ete limite en 2024 par des temperatures hivernales douces"
      polluants: ["PM2.5", "PM10"]
      confiance: "haute"
      source: "Airparif, Bilan de la qualite de l'air 2024 - Essonne, 2025, p. 2 - https://www.airparif.fr/sites/default/files/document_publication/Bilan_QA_91_2024.pdf"
  topographie_climat: null
  regime_episodes:
    - saison: "ete"
      polluant: "O3"
      mecanisme: "Seul polluant a ne pas avoir baisse en 2024, alors que la pluviometrie record et l'hiver doux faisaient reculer tous les autres"
      confiance: "haute"
      source: "Airparif, Bilan de la qualite de l'air 2024 - Essonne, 2025, p. 2 - https://www.airparif.fr/sites/default/files/document_publication/Bilan_QA_91_2024.pdf"
  transport_longue_distance: null
  cadre_decision:
    ppa: "PPA d'Ile-de-France 2025-2030, entre en vigueur le 30 janvier 2025"
    zfe: "Aucune ZFE-m en Essonne ; celle de la Metropole du Grand Paris ne couvre pas le departement"
    contentieux_no2: false
    confiance: "moyenne"
    source: "DRIEAT Ile-de-France, Entree en vigueur du quatrieme PPA, 30 janvier 2025 - https://www.drieat.ile-de-france.developpement-durable.gouv.fr/entree-en-vigueur-du-4e-plan-de-protection-de-l-a13173.html ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Une annee de pluviometrie record fait baisser toutes les concentrations sauf
        l'ozone : comparer deux annees revient a comparer deux meteorologies, et un
        modele credite a tort les politiques publiques d'une amelioration climatique.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Les depassements sont ponctuels et strictement au droit des axes : la population
        exposee depend de la distance a la voirie, une echelle que ne restitue aucune
        maille kilometrique.
      confiance: "haute"
      speculatif: false
  sans_source: null

- code: "94"
  nom: "Val-de-Marne"
  region: "Ile-de-France"
  resume: >
    NO2 encore en depassement recurrent pour 10 000 habitants, aux abords de l'A4, l'A6
    et l'A86, malgre 60 % d'emissions de NOx en moins depuis 2005.
  sources_dominantes:
    - libelle: "Autoroutes A4, A6 et A86 : les depassements de valeur limite en NO2 comme en PM10 se relevent a leur droit et a leur voisinage"
      polluants: ["NO2", "PM10"]
      confiance: "haute"
      source: "Airparif, Bilan 2021 de la qualite de l'air - Val-de-Marne, septembre 2022, p. 3 et p. 5 - https://www.airparif.fr/sites/default/files/pdf/Bilan_94_2021.pdf"
    - libelle: "Trafic routier, contributeur principal a la baisse des emissions : pres de 60 % de NOx en moins entre 2005 et 2018 et pres de 70 % pour les particules du transport"
      polluants: ["NO2", "PM2.5", "PM10"]
      confiance: "haute"
      source: "Airparif, Bilan 2021 de la qualite de l'air - Val-de-Marne, septembre 2022, p. 4 et p. 8 - https://www.airparif.fr/sites/default/files/pdf/Bilan_94_2021.pdf"
    - libelle: "Plateforme aeroportuaire de Paris-Orly, qui borde le departement et fait l'objet d'une surveillance distincte"
      polluants: ["NO2", "PM2.5"]
      confiance: "haute"
      source: "Airparif, Bilan 2021 de la qualite de l'air - Val-de-Marne, septembre 2022, p. 3 - https://www.airparif.fr/sites/default/files/pdf/Bilan_94_2021.pdf"
  topographie_climat: null
  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Deux hivers consecutifs peu rigoureux et dispersifs ont accelere la baisse des niveaux : la meteorologie explique une part de l'evolution recente au moins aussi grande que les emissions"
      confiance: "haute"
      source: "Airparif, Bilan 2021 de la qualite de l'air - Val-de-Marne, septembre 2022, p. 4 - https://www.airparif.fr/sites/default/files/pdf/Bilan_94_2021.pdf"
  transport_longue_distance: null
  cadre_decision:
    ppa: "PPA d'Ile-de-France 2025-2030, entre en vigueur le 30 janvier 2025"
    zfe: "ZFE-m de la Metropole du Grand Paris, dont le Val-de-Marne fait partie"
    contentieux_no2: true
    confiance: "moyenne"
    source: "DRIEAT Ile-de-France, Entree en vigueur du quatrieme PPA, 30 janvier 2025 - https://www.drieat.ile-de-france.developpement-durable.gouv.fr/entree-en-vigueur-du-4e-plan-de-protection-de-l-a13173.html ; CJUE, arret C-636/18 du 24 octobre 2019, zone agglomeration parisienne - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Departement de petite couronne traverse par l'A86 et l'A4 et borde par
        Paris-Orly : les gradients y sont ceux d'un tissu continu et dense, sans fond
        rural de reference a l'interieur de ses limites.
      confiance: "moyenne"
      speculatif: true
  sans_source:
    - "Le bilan disponible porte sur 2021 et non sur 2024 : Airparif publie les bilans recents sous document_publication/Bilan_QA_<code>_2024 pour 75, 91 et 93 seulement, et les millesimes anterieurs sous pdf/Bilan_<code>_<annee>."
    - "Le contentieux europeen porte sur la zone agglomeration parisienne et non sur des departements : le rattachement du Val-de-Marne a cette zone est deduit de sa position en petite couronne, pas lu dans l'arret."

