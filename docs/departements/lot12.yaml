  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Episode du 24 novembre 2024, non prevu, aux sources principalement primaires issues de la combustion de biomasse"
      confiance: "haute"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Episode regional des 13 et 14 janvier 2024, conditions stables et forte contribution de particules importees"
      confiance: "haute"
