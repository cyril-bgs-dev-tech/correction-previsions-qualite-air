- code: "87"
  nom: "Haute-Vienne"
  region: "Nouvelle-Aquitaine"
  resume: >
    Le NO2 a recule de 44 % en dix ans quand le SO2 n'a pas bouge : Saillat-sur-Vienne
    ne suit aucune tendance.
  sources_dominantes:
    - libelle: "Site industriel de Saillat-sur-Vienne, seule station du departement sous influence industrielle, suivie pour le SO2 depuis 2008"
      polluants: ["SO2", "PM10"]
      confiance: "haute"
      source: "Atmo Nouvelle-Aquitaine, Bilan annuel 2024 de la qualite de l'air en Haute-Vienne, juin 2025, p. 4 - https://www.atmo-nouvelleaquitaine.org/sites/nouvelleaquitaine/files/medias/documents/2025-06/BAQA_DEPT_HauteVienne_D87_2025-06-02.pdf"
    - libelle: "Trafic routier de l'agglomeration de Limoges, suivi par deux stations - Aine depuis 2003 et Berland depuis 2019"
      polluants: ["NO2"]
      confiance: "haute"
      source: "Atmo Nouvelle-Aquitaine, Bilan annuel 2024 de la qualite de l'air en Haute-Vienne, juin 2025, p. 4 - https://www.atmo-nouvelleaquitaine.org/sites/nouvelleaquitaine/files/medias/documents/2025-06/BAQA_DEPT_HauteVienne_D87_2025-06-02.pdf"
  topographie_climat: null
  regime_episodes: null
  transport_longue_distance: null
  cadre_decision:
    ppa: "Non documente dans le bilan departemental 2024 consulte"
    zfe: "Non documentee dans le bilan departemental 2024 consulte"
    contentieux_no2: false
    confiance: "basse"
    source: "Atmo Nouvelle-Aquitaine, Bilan annuel 2024 de la qualite de l'air en Haute-Vienne, juin 2025, p. 3 - https://www.atmo-nouvelleaquitaine.org/sites/nouvelleaquitaine/files/medias/documents/2025-06/BAQA_DEPT_HauteVienne_D87_2025-06-02.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Sur dix ans, le NO2 recule de 44 % et le CO de 33 % pendant que le SO2 reste
        stable a 0 % : un modele qui apprend une tendance commune a tous les polluants
        se trompera sur la station industrielle, qui n'en suit aucune.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Cinq stations seulement, dont trois hors des zones urbaines : l'evaluation
        departementale repose sur un echantillon dont deux points sont sous influence
        d'un seul site industriel.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "88"
  nom: "Vosges"
  region: "Grand Est"
  resume: >
    Le massif vosgien abrite l'Alsace et lui vaut tous les episodes d'ozone ; la facade
    ouest, ou se trouve le departement, reste relativement epargnee.
  sources_dominantes:
    - libelle: "Chauffage residentiel au bois, principal emetteur de benzo[a]pyrene et de particules dans les departements ruraux du sud du Grand Est"
      polluants: ["PM2.5", "PM10", "COV"]
      confiance: "moyenne"
      source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 6 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf"
  topographie_climat:
    libelle: >
      Le massif des Vosges cree un effet d'abri qui reduit les precipitations et
      stabilise l'atmosphere dans le fosse rhenan, a l'est. Le departement est sur la
      facade ouest du massif, celle que les episodes d'ozone epargnent le plus souvent.
    effet: "dispersif"
    vents_nommes: null
    confiance: "haute"
    source: "ATMO Grand Est, Bilan qualite de l'air Grand Est 2025, 2026, p. 16 et p. 21 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2026-03/BilanQualit%C3%A9del'Air%202025.pdf"
  regime_episodes:
    - saison: "ete"
      polluant: "O3"
      mecanisme: "Les episodes d'ozone du Grand Est surviennent systematiquement lors de fortes chaleurs sans vent pendant plusieurs jours ; ils touchent l'Alsace abritee derriere les Vosges et epargnent relativement la facade ouest"
      confiance: "haute"
      source: "ATMO Grand Est, Bilan qualite de l'air Grand Est 2025, 2026, p. 21 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2026-03/BilanQualit%C3%A9del'Air%202025.pdf"
  transport_longue_distance: null
  cadre_decision:
    ppa: "Aucun PPA dans les Vosges ; le declenchement des procedures y obeit a un critere de 50 000 habitants exposes, comme dans les Ardennes, l'Aube, la Haute-Marne et la Meuse, et non au critere de 10 % de la population applique aux departements plus peuples de la region"
    zfe: "Aucune ZFE-m documentee dans les Vosges"
    contentieux_no2: false
    confiance: "haute"
    source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 17 (criteres de declenchement, arrete du 7 avril 2016 repris par l'AIP du 24 mai 2017) - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Le relief separe deux regimes d'ozone opposes a moins de cinquante kilometres :
        l'Alsace abritee accumule, la facade vosgienne est balayee. Une maille qui
        chevauche la crete moyenne les deux et ne decrit ni l'un ni l'autre.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Le seuil de declenchement est un nombre absolu d'habitants exposes - 50 000 -
        et non une part de la population : a concentration identique, un episode
        declenche dans un departement peuple et pas ici.
      confiance: "haute"
      speculatif: false
  sans_source: null

- code: "89"
  nom: "Yonne"
  region: "Bourgogne-Franche-Comte"
  resume: >
    Departement de la Zone Regionale, decrit par les seules stations d'Auxerre et de
    Sens, et touche par les quatre episodes regionaux de 2024.
  sources_dominantes:
    - libelle: "Combustion de biomasse, source primaire identifiee dans les episodes hivernaux de particules de la region"
      polluants: ["PM10", "PM2.5"]
      confiance: "moyenne"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
  topographie_climat: null
  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Episode des 13 et 14 janvier 2024 : conditions fraiches, ensoleillees et stables depuis plusieurs jours, avec une forte contribution de particules importees"
      confiance: "haute"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
    - saison: "printemps"
      polluant: "PM10"
      mecanisme: "L'ammoniac agricole est au printemps le principal precurseur de particules secondaires de nitrate d'ammonium, avec des pics lors des periodes d'epandage"
      confiance: "haute"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
  transport_longue_distance:
    - origine: "Europe"
      polluant: "PM10"
      regime: "forte contribution de particules importees lors de l'episode hivernal des 13 et 14 janvier 2024"
      confiance: "haute"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
  cadre_decision:
    ppa: "Aucun PPA ; l'Yonne releve de la Zone Regionale, hors des quatre Zones A Risque de Bourgogne-Franche-Comte"
    zfe: "Aucune ZFE-m documentee dans l'Yonne"
    contentieux_no2: false
    confiance: "haute"
    source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 19 et p. 47 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Deux stations, Auxerre et Sens, portent seules la representativite d'un
        departement etendu classe en Zone Regionale : une erreur locale sur l'une d'elles
        se propage a tout le score departemental.
      confiance: "moyenne"
      speculatif: true
    - libelle: >
        L'episode de janvier tient pour une part importante a des particules importees :
        un correctif ancre sur les emissions locales ne peut pas le reproduire, et
        l'attribuera au chauffage.
      confiance: "haute"
      speculatif: false
  sans_source: null

- code: "90"
  nom: "Territoire de Belfort"
  region: "Bourgogne-Franche-Comte"
  resume: >
    Zone A Risque de l'aire Belfort-Montbeliard, et theatre du seul episode manque de
    2024 : des sources primaires de combustion de biomasse.
  sources_dominantes:
    - libelle: "Combustion de biomasse en sources primaires, cause identifiee de l'episode du 24 novembre 2024"
