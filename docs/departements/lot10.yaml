- code: "55"
  nom: "Meuse"
  region: "Grand Est"
  resume: >
    L'agriculture y pese 61 % des PM10 et 50 % des NOx, loin devant la region ; le
    stockage profond de Bure y fait surveiller l'air depuis 2011.
  sources_dominantes:
    - libelle: "Agriculture, premier emetteur : 61 % des PM10 du departement contre 47 % au niveau regional, et 50 % des NOx contre 26 %"
      polluants: ["PM10", "NO2", "NH3"]
      confiance: "haute"
      source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 6 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf"
    - libelle: "Residentiel et tertiaire, premier emetteur de PM2.5 et 87 % des emissions de benzo[a]pyrene, en lien avec le chauffage au bois"
      polluants: ["PM2.5", "COV"]
      confiance: "haute"
      source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 6 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf"
    - libelle: "Centre de stockage profond de dechets radioactifs de Bure : l'air est suivi depuis 2011 a l'Observatoire perenne de l'environnement de Houdelaincourt, avec metaux lourds, HAP, ammoniac et black carbon"
      polluants: ["PM10", "NO2", "NH3"]
      confiance: "haute"
      source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 5 et p. 15 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf"
  topographie_climat: null
  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Episode de type mixte : inversion de temperature, combustion du trafic et du chauffage au bois, et formation importante de nitrate d'ammonium secondaire a partir du NH3 et des NOx"
      confiance: "haute"
      source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 19 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf"
    - saison: "ete"
      polluant: "O3"
      mecanisme: "Precurseurs emis en ville puis transportes vers les zones periurbaines et rurales ou l'ozone se forme sous rayonnement et chaleur ; aucun episode d'ozone dans la Meuse depuis 2019"
      confiance: "haute"
      source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 15 et p. 20 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf"
  transport_longue_distance: null
  cadre_decision:
    ppa: "Aucun PPA ; en 2023 la procedure prefectorale d'information n'a ete declenchee dans la Meuse ni pour les particules, ni pour le SO2, le NO2 ou l'ozone"
    zfe: "Aucune ZFE-m documentee dans les sources consultees"
    contentieux_no2: false
    confiance: "haute"
    source: "ATMO Grand Est, Bilan 2023 de la qualite de l'air - CODERST de la Meuse, 2024, p. 17 et p. 18 - https://www.atmo-grandest.eu/sites/grandest/files/medias/documents/2024-10/Bilan_CODERST_Meuse_2023.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Le declenchement obeit a un critere de surface - 100 km2 sur la region, dont au
        moins 10 km2 dans le departement - et a un seuil de 50 000 habitants exposes
        propre a la Meuse. Une prevision juste en concentration peut donc ne declencher
        aucune procedure, et l'inverse est vrai.
      confiance: "haute"
      speculatif: false
    - libelle: >
        L'episode regional de particules etait pour l'essentiel du nitrate d'ammonium
        forme a partir du NH3 agricole et des NOx : un modele sans chimie des aerosols
        secondaires manque le pic la ou les emissions primaires sont faibles.
      confiance: "moyenne"
      speculatif: true
    - libelle: >
        La station rurale de Jonville est restee a 37 µg/m3 pour un seuil de
        declenchement a 50 pendant que la region etait en episode : un correctif ancre
        sur le fond regional surestime ici.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "56"
  nom: "Morbihan"
  region: "Bretagne"
  resume: >
    Aucun episode declenche en 2025 malgre des journees mauvaises : les criteres
    prefectoraux de superficie et de population n'ont pas ete atteints.
  sources_dominantes:
    - libelle: "Chauffage residentiel, principale source des PM2.5, dont les niveaux montent lors des periodes hivernales peu dispersives"
      polluants: ["PM2.5", "PM10"]
      confiance: "haute"
      source: "Air Breizh, Bilan regional 2025 de la qualite de l'air en Bretagne, 2026, p. 50 et p. 68 - https://www.airbreizh.asso.fr/voy_content/uploads/2026/06/moins-lourd-rapport-air-breizh-2025-complet.pdf"
    - libelle: "Trafic routier : les seuils de NO2 sont le plus souvent respectes, les depassements ponctuels survenant en zones a fort trafic"
      polluants: ["NO2"]
      confiance: "haute"
      source: "Air Breizh, Bilan regional 2025 de la qualite de l'air en Bretagne, 2026, p. 56 - https://www.airbreizh.asso.fr/voy_content/uploads/2026/06/moins-lourd-rapport-air-breizh-2025-complet.pdf"
  topographie_climat: null
  regime_episodes:
    - saison: "hiver"
      polluant: "PM2.5"
      mecanisme: "Conditions hivernales peu dispersives - froid et stabilite atmospherique - combinees a la hausse des besoins de chauffage et a des apports transfrontaliers"
      confiance: "haute"
      source: "Air Breizh, Bilan regional 2025 de la qualite de l'air en Bretagne, 2026, p. 50 - https://www.airbreizh.asso.fr/voy_content/uploads/2026/06/moins-lourd-rapport-air-breizh-2025-complet.pdf"
    - saison: "ete"
      polluant: "O3"
      mecanisme: "Ozone, polluant le plus frequemment responsable des indices degrades a mauvais en periode estivale"
      confiance: "haute"
      source: "Air Breizh, Bilan regional 2025 de la qualite de l'air en Bretagne, 2026, p. 60 - https://www.airbreizh.asso.fr/voy_content/uploads/2026/06/moins-lourd-rapport-air-breizh-2025-complet.pdf"
  transport_longue_distance:
    - origine: "Europe du Nord-Ouest"
      polluant: "PM2.5"
      regime: "emissions transfrontalieres citees avec les emissions locales dans le bilan du panache de janvier"
      confiance: "moyenne"
      source: "Air Breizh, Bilan regional 2025 de la qualite de l'air en Bretagne, 2026, p. 50 - https://www.airbreizh.asso.fr/voy_content/uploads/2026/06/moins-lourd-rapport-air-breizh-2025-complet.pdf"
  cadre_decision:
    ppa: "Aucun PPA documente dans le Morbihan dans les sources consultees ; les PPA bretons concernent Rennes Metropole"
    zfe: "Aucune ZFE-m documentee dans le Morbihan"
    contentieux_no2: false
    confiance: "moyenne"
    source: "Air Breizh, Bilan regional 2025 de la qualite de l'air en Bretagne, 2026, p. 64 - https://www.airbreizh.asso.fr/voy_content/uploads/2026/06/moins-lourd-rapport-air-breizh-2025-complet.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        En 2025 aucun episode n'a ete declenche dans le Morbihan ni dans les
        Cotes-d'Armor parce que les criteres prefectoraux de superficie et de population
        n'etaient pas atteints - alors que la qualite de l'air a ete ponctuellement
        mauvaise. Une evaluation calee sur les declenchements sous-compte les evenements
        reellement vecus.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Le departement compte plus de jours degrades en ozone qu'en particules : un
        modele regle sur le regime hivernal des PM se trompe de saison sur ce territoire.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "58"
  nom: "Nievre"
  region: "Bourgogne-Franche-Comte"
  resume: >
    Departement de la Zone Regionale, sans zone a risque : la Nievre a subi la plus
    longue alerte regionale aux pollens d'ambroisie, six semaines d'affilee.
  sources_dominantes:
    - libelle: "Combustion de biomasse, source primaire identifiee dans les episodes hivernaux de particules de la region"
      polluants: ["PM10", "PM2.5"]
      confiance: "moyenne"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
  topographie_climat: null
  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Episode regional des 13 et 14 janvier 2024, ayant declenche une procedure d'information et de recommandation sur les huit departements de la region"
      confiance: "haute"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
    - saison: "printemps"
      polluant: "PM10"
      mecanisme: "Remontee de particules sahariennes le 8 avril 2024, prevue la veille pour le Doubs et la Nievre seulement"
      confiance: "haute"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
  transport_longue_distance:
    - origine: "Sahara"
      polluant: "PM10"
      regime: "remontee de particules sahariennes, cause de deux des quatre episodes regionaux de 2024"
      confiance: "haute"
      source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 80 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf"
  cadre_decision:
    ppa: "Aucun PPA ; la Nievre releve de la Zone Regionale, le reste du territoire hors des quatre Zones A Risque de Bourgogne-Franche-Comte"
    zfe: "Aucune ZFE-m documentee dans la Nievre"
    contentieux_no2: false
    confiance: "haute"
    source: "Atmo Bourgogne-Franche-Comte, Bilan annuel 2024, 2025, p. 19 - https://www.atmo-bfc.org/sites/default/files/atmo/documents2025-05/2024_Bilan-annuel_Basse-def.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        La Nievre appartient a la Zone Regionale, celle qui reste une fois les quatre
        agglomerations a risque decoupees : elle est surveillee par un maillage lache,
        et une station comme Nevers y porte a elle seule la representativite d'un
        territoire tres etendu.
      confiance: "moyenne"
      speculatif: true
    - libelle: >
        Un episode y a ete prevu la veille en meme temps que dans le Doubs, a l'autre
        bout de la region : la prevision regionale traite ces deux departements comme
        un seul objet alors que leurs sources et leur relief different.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "60"
  nom: "Oise"
  region: "Hauts-de-France"
  resume: >
    L'agriculture fait 47 % des PM10 et l'industrie 84 % du SO2 : deux dominantes que
    le transport, pourtant premier pour les NOx, ne recouvre pas.
  sources_dominantes:
    - libelle: "Agriculture, premier emetteur de particules : 47 % des PM10 et 32 % des PM2.5 du departement"
      polluants: ["PM10", "PM2.5", "NH3"]
      confiance: "moyenne"
      source: "Atmo Picardie, Bilan territorial 2015 - Conseil departemental de l'Oise, 2016, p. 3 (inventaire d'emissions 2010) - https://www.atmo-hdf.fr/sites/hdf/files/content/migrated/Bilans-territoriaux/BT_oise-min.pdf"
    - libelle: "Industrie, 84 % des emissions de dioxyde de soufre et 24 % des NOx du departement"
      polluants: ["SO2", "NO2"]
      confiance: "moyenne"
      source: "Atmo Picardie, Bilan territorial 2015 - Conseil departemental de l'Oise, 2016, p. 3 (inventaire d'emissions 2010) - https://www.atmo-hdf.fr/sites/hdf/files/content/migrated/Bilans-territoriaux/BT_oise-min.pdf"
    - libelle: "Transport, premier emetteur d'oxydes d'azote avec 62 %, mais seulement 21 % des PM10"
      polluants: ["NO2", "PM10"]
      confiance: "moyenne"
      source: "Atmo Picardie, Bilan territorial 2015 - Conseil departemental de l'Oise, 2016, p. 3 (inventaire d'emissions 2010) - https://www.atmo-hdf.fr/sites/hdf/files/content/migrated/Bilans-territoriaux/BT_oise-min.pdf"
  topographie_climat: null
  regime_episodes:
    - saison: "toute_annee"
      polluant: "PM10"
      mecanisme: "En 2015, 10 episodes de pollution ont ete constates en Picardie sur 38 jours, dont 8 aux PM10 et 2 a l'ozone"
      confiance: "moyenne"
      source: "Atmo Picardie, Bilan territorial 2015 - Conseil departemental de l'Oise, 2016, p. 5 - https://www.atmo-hdf.fr/sites/hdf/files/content/migrated/Bilans-territoriaux/BT_oise-min.pdf"
  transport_longue_distance: null
  cadre_decision:
    ppa: "Non documente pour l'Oise dans les sources consultees ; les PPA des Hauts-de-France couvrent les agglomerations de Lille et le bassin minier"
    zfe: "Aucune ZFE-m documentee dans l'Oise"
    contentieux_no2: false
    confiance: "basse"
    source: "Atmo Hauts-de-France, Bilan territorial 2024 - Hauts-de-France, 2025, p. 6 (les episodes de pollution sont declenches au niveau departemental) - https://www.atmo-hdf.fr/sites/hdf/files/medias/documents/2025-06/BT_HDF_2024_0.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Les episodes des Hauts-de-France sont declenches a l'echelle departementale
        alors que le bilan public est regional : la donnee de reference pour evaluer une
        prevision sur l'Oise n'est pas au meme grain que la decision qu'elle sert.
      confiance: "moyenne"
      speculatif: true
  sans_source:
    - "Le seul bilan departemental localise pour l'Oise date de 2015 et repose sur l'inventaire d'emissions 2010 d'Atmo Picardie : la repartition sectorielle citee est structurelle mais ancienne. Le bilan territorial 2024 d'Atmo Hauts-de-France, lui, est regional."
    - "Attention en recherche plein texte : Oise et Somme sont aussi des noms de rivieres, et sommes-nous produit un faux positif sur Somme."

