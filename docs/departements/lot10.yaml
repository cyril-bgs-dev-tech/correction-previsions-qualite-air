  topographie_climat: null
  regime_episodes: null
  transport_longue_distance: null
  cadre_decision:
    ppa: "Non documente dans le bilan departemental 2024 consulte"
    zfe: "Non documentee dans le bilan departemental 2024 consulte"
    contentieux_no2: false
    confiance: "basse"
    source: "Atmo Nouvelle-Aquitaine, Bilan annuel 2024 de la qualite de l'air en Pyrenees-Atlantiques, juin 2025, p. 3 - https://www.atmo-nouvelleaquitaine.org/sites/nouvelleaquitaine/files/medias/documents/2025-06/BAQA_DEPT_PyreneesAtlantiques_D64_2025-06-02.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Sur dix ans le NO2 recule de 37 %, les PM10 de 34 % et les PM2.5 de 40 %, mais
        le SO2 de 8 % seulement et l'ozone monte de 1 % : la signature industrielle de
        Lacq ne suit pas la tendance generale, et un modele cale sur elle la manquera.
      confiance: "moyenne"
      speculatif: true
    - libelle: >
        Aucun episode de pollution n'a ete constate dans le departement en 2024 : un jeu
        d'evaluation departemental de cette annee-la ne contient aucun evenement positif,
