      confiance: "haute"
      source: "Atmo Normandie, Bilan 2024 de la qualite de l'air, 2025, p. 14 - https://www.atmonormandie.fr/sites/normandie/files/medias/documents/2025-10/Bilan%202024_0.pdf"
    - libelle: "Alencon fait partie des quatre seules stations normandes ou la valeur guide OMS pour le NO2 n'est pas depassee"
      polluants: ["NO2"]
      confiance: "haute"
      source: "Atmo Normandie, Bilan 2024 de la qualite de l'air, 2025, p. 10 - https://www.atmonormandie.fr/sites/normandie/files/medias/documents/2025-10/Bilan%202024_0.pdf"
  topographie_climat: null
  regime_episodes: null
  transport_longue_distance: null
  cadre_decision:
    ppa: "Aucun PPA documente dans l'Orne dans les sources consultees"
    zfe: "Aucune ZFE-m documentee dans l'Orne ; en Normandie la demarche est portee par Caen la Mer"
    contentieux_no2: false
    confiance: "moyenne"
    source: "Atmo Normandie, Bilan 2024 de la qualite de l'air, 2025, p. 10 - https://www.atmonormandie.fr/sites/normandie/files/medias/documents/2025-10/Bilan%202024_0.pdf ; CJUE, arret C-636/18, 2019 - https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Le departement est represente par un fond rural MERA et par une station urbaine
        parmi les moins chargees de la region : un correctif appris sur des sites urbains
        charges n'a ici aucun biais a rattraper, et risque de degrader un signal deja
        propre.
      confiance: "moyenne"
      speculatif: true
  sans_source:
    - "Atmo Normandie indique deux stations seulement dans l'Orne, ce qui limite toute evaluation departementale ; l'information vient d'une page web sans document date."

