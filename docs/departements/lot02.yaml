  regime_episodes:
    - saison: "hiver"
      polluant: "PM10"
      mecanisme: "Chauffage au bois et autres combustions accumulés sous inversion dans les bassins chambérien, mauriennais et tarentais"
      confiance: "haute"
      source: "Atmo Auvergne-Rhône-Alpes, Bilan 2024 de la qualité de l'air de la Savoie, 2025, p. 14-16 — https://www.atmo-auvergnerhonealpes.fr/sites/aura/files/medias/documents/2025-07/ATMO_PPT_Bilan-2024_73-SAVOIE_v0.pdf ; Préfecture de la Savoie, Pollution de l'air, 2025 — https://www.savoie.gouv.fr/Actualites/Actualites/Fin-de-la-vigilance-jaune-pollution-atmospherique"
  transport_longue_distance:
    - origine: "Sahara"
      polluant: "PM10"
      regime: "depression_sur_l_Afrique_du_Nord_et_flux_de_sud"
      confiance: "haute"
      source: "Atmo Auvergne-Rhône-Alpes, Retour sur le phénomène des poussières sahariennes, 2024 — https://www.atmo-auvergnerhonealpes.fr/actualite/retour-sur-le-phenomene-des-poussieres-sahariennes"
    - origine: "Feux_de_foret_du_Canada"
      polluant: "PM10"
      regime: "transport_intercontinental_en_altitude_puis_rabattement"
      confiance: "haute"
      source: "Préfecture de la Savoie, Pollution de l'air - épisode de juin 2025, 2025 — https://www.savoie.gouv.fr/Actualites/Actualites/Fin-de-la-vigilance-jaune-pollution-atmospherique"
  cadre_decision:
    ppa: "Aucun PPA actif recense en Savoie en 2026"
    zfe: "ZCR de l'hypercentre de Chambery activable lors d'une alerte de niveau 2; aucune extension permanente n'a de calendrier defini"
    contentieux_no2: false
    confiance: "moyenne"
    source: "DREAL Auvergne-Rhône-Alpes, Appel à projets Mission Air 2026 - liste des PPA régionaux, 2026 — https://www.auvergne-rhone-alpes.developpement-durable.gouv.fr/appel-a-projets-mission-air-2026-a28639.html ; Grand Chambéry, PCAET 2026-2031 - programme d'actions, 2025 — https://www.grandchambery.fr/fileadmin/mediatheque/grand-chambery/action-agglo/dev_durable/3.2-Programme-d-actions-territoriales-les-fiches-actions.pdf ; CJUE, arrêt C-636/18, 2019 — https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
  pieges_modelisation:
    - libelle: >
        Un département réunit trois bassins d'air peu couplés; une correction unique mélange Chambéry, Maurienne-Tarentaise et haute montagne.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Une maille trop grossière lisse les fonds de vallée et surestime la hauteur de mélange lors des inversions hivernales.
      confiance: "haute"
      speculatif: false
    - libelle: >
        Fermetures de tunnels, reports sur l'A43 et chantiers alpins modifient brutalement le trafic; un inventaire annuel devient vite obsolète.
      confiance: "moyenne"
      speculatif: true
  sans_source: null

- code: "38"
  nom: "Isere"
  region: "Auvergne-Rhone-Alpes"
