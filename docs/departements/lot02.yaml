- code: "73"
  nom: "Savoie"
  region: "Auvergne-Rhone-Alpes"
  resume: >
    Bassin chambérien et vallées alpines cloisonnées concentrent les émissions hivernales; chauffage au bois, A43 et industrie mauriennaise créent des contrastes locaux.
  sources_dominantes:
    - libelle: "Chauffage résidentiel au bois"
