      confiance: "haute"
      source: "Atmo Auvergne-Rhône-Alpes, Bilan 2024 de la qualité de l'air de la Savoie, 2025, p. 7 — https://www.atmo-auvergnerhonealpes.fr/sites/aura/files/medias/documents/2025-07/ATMO_PPT_Bilan-2024_73-SAVOIE_v0.pdf"
  topographie_climat:
    libelle: >
      Bassin chambérien, Maurienne et Tarentaise fonctionnent comme des bassins d'air distincts; faible vent et inversions y limitent fortement le brassage.
