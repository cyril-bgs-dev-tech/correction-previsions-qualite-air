  cadre_decision:
    ppa: "PPA2 de la vallee de l'Arve approuve en 2019, evalue puis modifie pour 2025-2026; perimetre de 41 communes"
    zfe: "ZFE-m du Grand Annecy et d'Annemasse Agglo en vigueur depuis le 1er janvier 2025; vehicules non classes interdits"
    contentieux_no2: true
    confiance: "haute"
    source: "DREAL Auvergne-Rhône-Alpes, Évaluation du PPA2 et modification pour 2025-2026, 2025 — https://www.auvergne-rhone-alpes.developpement-durable.gouv.fr/evaluation-du-ppa-2-et-modification-du-ppa-2-pour-a28126.html ; Grand Annecy, La ZFE-m en pratique, mise à jour 2026 — https://www.grandannecy.fr/zfem/la-zfe-m-en-pratique ; Annemasse Agglo, ZFE-m déployée, 2025 — https://www.annemasse-agglo.fr/infos-et-loisirs/actualites/la-zone-faibles-emissions-mobilite-zfe-m-desormais-deployee-sur-lagglo ; CJUE, arrêt C-636/18, 2019 — https://curia.europa.eu/juris/liste.jsf?num=C-636/18&language=fr"
