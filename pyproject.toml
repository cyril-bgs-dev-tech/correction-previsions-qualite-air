[project]
name = "aq"
version = "0.1.0"
description = "Air Quality Intelligence — prévision et attribution causale de la qualité de l'air"
requires-python = ">=3.11"
# ⚠️ Ce bloc a déclaré **trois** paquets pendant que le code en importait quinze. Un clone
# frais ne pouvait pas s'exécuter, et l'erreur n'apparaissait qu'au premier `ImportError`,
# souvent au milieu d'un lot. Les bornes basses sont les versions sous lesquelles le
# projet a effectivement tourné — pas des suppositions.
dependencies = [
    # Socle — présent dans tous les chemins de code
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15.0",        # lecture/écriture parquet, partout
    "scipy>=1.11",
    # Modèles
    "scikit-learn>=1.4",
    "lightgbm>=4.3",        # moteur de production, cf. src/aq/models/moteur.py
    "xgboost>=2.0",         # comparaison d'algorithmes uniquement
    "optuna>=3.6",          # recherche d'hyperparamètres — mesurée sans apport, conservée
    # Acquisition
    "requests>=2.31",
    "cdsapi>=0.7",          # Copernicus ADS/CDS
    # Géospatial
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",        # lecture COG par fenêtre (MNT, TROPOMI)
    # Formats scientifiques
    "xarray>=2024.1",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
# Décodage GRIB — requis seulement par les scripts IFS/ECMWF. `cfgrib` tire une
# bibliothèque système (eccodes) : l'isoler évite de casser une installation qui n'en a
# pas besoin.
grib = ["cfgrib>=0.9"]
# Démonstration et figures.
demo = ["streamlit>=1.40", "plotly>=6.0", "matplotlib>=3.8"]
# Capture d'écran des pages publiées.
web = ["playwright>=1.50"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `scripts` est sur le chemin : plusieurs scripts portent une logique testable
# — la reprise de téléchargement, le plan de requêtes — qu'il serait absurde de
# dupliquer dans `src` pour pouvoir l'éprouver.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
